# SPDX-License-Identifier: MIT

# Builds a toolchain from Minecraft's own data generator and publishes it.
#
# Manual only. It downloads a server.jar and cuts a release, and neither of those
# should happen because someone pushed a commit.

name: toolchain

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Minecraft version, as the launcher spells it (e.g. 1.21.4)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Through the environment rather than into the script text: an input is not
      # something to paste into a shell command.
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # The data generator runs on whatever the version was built for, and the
          # newest ones want 25. Older ones run on it too.
          java-version: "25"

      - name: Build the toolchain
        run: ./scripts/build-toolchain.sh "$VERSION" toolchains

      - name: Install the tools the check below needs
        uses: jdx/mise-action@v2
        with:
          cache: true

      # The real check: the biggest example, against the table that was just built.
      # `examples/arena` pins a version, so it is copied and re-pointed rather than
      # built where it stands.
      - name: Compile an example with it
        env:
          MINEWELL_HOME: ${{ github.workspace }}
        run: |
          cp -r examples/arena "$RUNNER_TEMP/check"
          sed -i "s/^toolchain = .*/toolchain = \"$VERSION\"/" "$RUNNER_TEMP/check/minewell.toml"
          cargo build -p mwl
          (cd "$RUNNER_TEMP/check" && "$GITHUB_WORKSPACE/target/debug/mwl" build --release)

      - name: Package
        run: tar -czf "mwl-toolchain-$VERSION.tar.gz" -C toolchains "$VERSION"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "toolchain-$VERSION" \
            --title "toolchain $VERSION" \
            --notes "Command table generated from Minecraft $VERSION's own data generator. Unpack into \$MINEWELL_HOME/toolchains." \
            "mwl-toolchain-$VERSION.tar.gz"
