# SPDX-License-Identifier: MIT

# Publishes `mwl` binaries for a tag.
#
# Tag-driven rather than manual: the version in the tag and the version in
# `Cargo.toml` are the same fact, and a release that does not correspond to a commit
# is a release nobody can reproduce.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag

  binaries:
    needs: create
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
          # Apple ships both slices, so the Intel build cross-compiles from the arm64
          # runner. There is no Intel macOS runner any more.
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Not mise: this job wants a compiler and nothing else, and one that works the
      # same way on all three operating systems is worth more here than the task list.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release -p mwl --target ${{ matrix.target }}

      # `tar` is bsdtar on the Windows runners and on macOS, so one command covers all
      # three. Windows 10 and later ship it, which is what unpacks the result.
      - name: Package
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          version="${TAG#v}"
          binary=mwl
          if [ "$RUNNER_OS" = "Windows" ]; then binary=mwl.exe; fi
          asset="mwl-$version-$TARGET.tar.gz"
          tar -czf "$asset" -C "target/$TARGET/release" "$binary"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "$ASSET"
