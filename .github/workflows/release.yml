# SPDX-License-Identifier: MIT

# Publishes `mwl` binaries for a tag.
#
# Tag-driven rather than manual: the version in the tag and the version in
# `Cargo.toml` are the same fact, and a release that does not correspond to a commit
# is a release nobody can reproduce.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag

  binaries:
    needs: create
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Build
        run: cargo build --release -p mwl --target ${{ matrix.target }}

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          version="${TAG#v}"
          tar -czf "mwl-$version-$TARGET.tar.gz" -C "target/$TARGET/release" mwl
          echo "ASSET=mwl-$version-$TARGET.tar.gz" >> "$GITHUB_ENV"

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "$ASSET"
