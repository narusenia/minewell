# SPDX-License-Identifier: MIT

[package]
name = "mwlc"
version = "0.0.0"
description = "The minewell compiler: .mwl to Minecraft datapack"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
miette = "7"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.9"

[dev-dependencies]
# The graphical renderer lives behind `fancy`. The library only needs the derive and
# the traits; only tests and the CLI actually draw anything.
insta = "1"
miette = { version = "7", features = ["fancy"] }
tempfile = "3"

[lints]
workspace = true
