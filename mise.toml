[tools]
# `components` is required: mise installs rust with the minimal profile, so rustfmt
# and clippy are absent unless named here.
rust = { version = "stable", components = "rustfmt,clippy" }
"cargo-insta" = "latest"
# For the editor grammar (`editors/`). The generated parser is not committed, so the
# CLI is needed to build and test it.
"tree-sitter" = "0.26"
# The VS Code extension is JavaScript, and `mise run editors` checks it parses.
node = "22"
# M6 will add `java` here, for `mwl toolchain build-from-jar`. Not needed before that.

[env]
RUST_BACKTRACE = "1"

# ---- everyday ----

[tasks.fmt]
description = "Format all crates"
run = "cargo fmt --all"

[tasks.lint]
description = "Clippy, warnings denied"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.check]
description = "Type check only (fast)"
run = "cargo check --all-targets"

[tasks.test]
description = "Run all tests"
run = "cargo test --all-features"

[tasks.build]
description = "Release build"
run = "cargo build --release"

# ---- focused test runs ----

[tasks."test:tinymcf"]
description = "Interpreter only (the loop to run while working on M0)"
run = "cargo test -p tinymcf"

[tasks."test:mwlc"]
description = "Compiler only"
run = "cargo test -p mwlc"

[tasks.grammar]
description = "Build the tree-sitter grammar and parse every example with it"
dir = "editors/tree-sitter-mwl"
run = [
  "tree-sitter generate",
  "tree-sitter parse --quiet ../../examples/*/src/*.mwl",
]

[tasks.editors]
description = "Check the editor extensions build"
run = [
  # The VS Code client is plain JavaScript, so this is the whole check short of
  # installing VS Code.
  "node --check editors/vscode/src/extension.js",
  "node -e \"JSON.parse(require('fs').readFileSync('editors/vscode/package.json'))\"",
  # Zed loads a WebAssembly extension, so the real check is that it still builds one.
  "rustup target add wasm32-wasip1",
  "cargo build --manifest-path editors/zed/Cargo.toml --target wasm32-wasip1",
]

[tasks.snap]
description = "Review insta snapshots"
run = "cargo insta review"

[tasks."snap:accept"]
description = "Accept all pending insta snapshots"
run = "cargo insta accept"

# ---- gate ----

[tasks.ci]
description = "Same checks as CI. Run before pushing"
depends = ["fmt:check", "lint", "test", "grammar", "editors"]

[tasks."fmt:check"]
run = "cargo fmt --all -- --check"
